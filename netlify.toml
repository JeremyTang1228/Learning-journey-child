[build]
  command = "npm run build"
  publish = "dist"

# 把同源 /api/* 交给 Edge Function，但它只做「透明转发」到腾讯云开发(CloudBase)
# 代理函数（见 cloudbase/proxy/index.js）。因为江苏平台 WAF 按来源 IP 封杀了
# Netlify/Vercel 出口，必须绕到大陆 IP 的 CloudBase 才能拿到播放凭证。
# Edge Function 的真实目标在 netlify/edge-functions/api-proxy.ts 的 TARGET 常量里配置。
[[edge_functions]]
  path = "/api/*"
  function = "api-proxy"
